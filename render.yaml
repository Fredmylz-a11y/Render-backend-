services:
  - type: web
    name: rhinoverse-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MARZPAY_API_KEY
        sync: false
      - key: MARZPAY_API_SECRET
        sync: false
      - key: MARZPAY_API_BASE
        value: https://wallet.wearemarz.com/api/v1
      - key: MARZPAY_COUNTRY
        value: UG
      - key: MARZPAY_CURRENCY
        value: UGX
      - key: CRON_SECRET
        sync: false
      - key: ADMIN_API_SECRET
        sync: false
      - key: MARZPAY_CALLBACK_URL
        sync: false
      - key: MIN_WITHDRAWAL
        value: '500'
